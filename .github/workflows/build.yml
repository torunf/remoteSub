name: build

# Every run builds both installers and publishes them as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".gitignore", ".gitattributes"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        # A pushed tag v1.2.3 gives 1.2.3; any other run gets 0.1.<run number>.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build_windows.ps1 -Version "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteSub-windows
          path: dist/RemoteSub-Setup-*.exe

  macos:
    needs: version
    # Apple Silicon runner: chiaki-ng only ships arm64 macOS builds.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build_mac.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteSub-macos
          path: dist/RemoteSub-*.pkg

  release:
    # Only when both installers built, so a release never ships one platform without the other.
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: RemoteSub ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/RemoteSub-Setup-*.exe
            dist/RemoteSub-*.pkg
