name: release-probe

# Manual check that GITHUB_TOKEN can still create releases: makes a draft release and deletes it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create and delete a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="probe-${{ github.run_id }}"
          gh release create "$tag" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
            --title "probe" --notes "temporary"
          gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          echo "GITHUB_TOKEN can create releases"
