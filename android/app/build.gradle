plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

// The native Remote Play library and its JNI glue are built straight from the chiaki-ng submodule.
def rootCMakeLists = "../chiaki-ng/CMakeLists.txt"
def rootCMakeListsContent = file(rootCMakeLists).text
static def grepVersionComponent(content, varname) {
    def match = content =~ /set\($varname ([0-9]+)\)/
    if(!match.find())
        throw new GradleException("Failed to find $varname in CMakeLists.txt")
    return match.group(1)
}
def chiakiVersionMajor = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_MAJOR")
def chiakiVersionMinor = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_MINOR")
def chiakiVersionPatch = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_PATCH")
def chiakiVersion = "$chiakiVersionMajor.$chiakiVersionMinor.$chiakiVersionPatch"
println("Determined Chiaki Version: $chiakiVersion")

// RemoteSub TV version; the chiaki-ng version it is built on is appended for bug reports.
def remoteSubVersion = "0.1.0"

// chiaki-ng generates its protocol code with nanopb, which needs a Python that has `protobuf`.
// scripts/build_android.sh makes one in android/.build-venv; REMOTESUB_PYTHON overrides it.
def buildPython = System.getenv("REMOTESUB_PYTHON") ?: file("../.build-venv/bin/python3").absolutePath
def pythonArgs = file(buildPython).exists() ? ["-DPYTHON_EXECUTABLE=$buildPython"] : []

android {
    namespace "com.metallic.chiaki"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.torunf.remotesub.tv"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "$remoteSubVersion (chiaki-ng $chiakiVersion)"
        // Android TV devices are ARM (many still run 32-bit userspace); x86_64 is for emulators.
        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86_64" }
        externalNativeBuild {
            cmake {
                arguments "-DCHIAKI_ENABLE_TESTS=OFF",
                        "-DCHIAKI_ENABLE_CLI=OFF",
                        "-DCHIAKI_ENABLE_GUI=OFF",
                        "-DCHIAKI_ENABLE_SETSU=OFF",
                        "-DCHIAKI_ENABLE_ANDROID=ON",
                        "-DCHIAKI_ENABLE_FFMPEG_DECODER=OFF",
                        "-DCHIAKI_ENABLE_PI_DECODER=OFF",
                        "-DCHIAKI_LIB_ENABLE_OPUS=OFF",
                        "-DCHIAKI_LIB_OPENSSL_EXTERNAL_PROJECT=ON",
                        "-DCHIAKI_LIB_JSONC_EXTERNAL_PROJECT=ON",
                        "-DCHIAKI_LIB_MINIUPNPC_EXTERNAL_PROJECT=ON",
                        "-DCHIAKI_ENABLE_STEAM_SHORTCUT=OFF",
                        "-DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF",
                        "-DANDROID_STL=c++_shared",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384",
                        *pythonArgs
            }
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += "-opt-in=kotlin.ExperimentalUnsignedTypes"
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path rootCMakeLists
        }
    }

    signingConfigs {
        release
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    Properties properties = new Properties()
    def propertiesFile = file("../local.properties")
    if (propertiesFile.exists()) {
        properties.load(propertiesFile.newDataInputStream())
    }

    if(properties.containsKey("remotesubKeystore")) {
        println("Enabling Local Signing")
        buildTypes.release.signingConfig = signingConfigs.release
        buildTypes.debug.signingConfig = signingConfigs.release
        signingConfigs.release.storeFile = file(properties.get("remotesubKeystore"))
        signingConfigs.release.storePassword = properties.get("remotesubKeystorePW")
        signingConfigs.release.keyAlias = properties.get("remotesubKeyAlias")
        signingConfigs.release.keyPassword = properties.get("remotesubKeyPW")
    } else {
        println("Signing not enabled")
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.core.ktx
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.preference.ktx
    implementation libs.material

    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx

    implementation libs.coroutines.android

    implementation libs.room.runtime
    ksp libs.room.compiler
    implementation libs.room.ktx

    implementation libs.moshi
    ksp libs.moshi.kotlin.codegen

    implementation libs.oboe

    // RemoteSub: on-device OCR (bundled Latin model, no Play services needed) and the offline
    // translation fallback used when no Ollama server is reachable.
    implementation libs.mlkit.text.recognition
    implementation libs.mlkit.translate
    implementation libs.coroutines.play.services

    testImplementation 'junit:junit:4.13.2'
}
